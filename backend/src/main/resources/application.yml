spring:
  application:
    name: invitely-backend

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 50
      thread-name-prefix: invitely-async-

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/invitely
    username: ${DB_USERNAME:invitely}
    password: ${DB_PASSWORD:invitely}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring AI — Vertex AI Gemini
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_CLOUD_PROJECT_ID:invitely-495718}
          location: us-central1
          chat:
            options:
              model: gemini-2.0-flash
              temperature: 0.8

# App config
invitely:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  slug-length: 8
  notifications:
    email:
      from: noreply@invitely.app
      sendgrid-key: ${SENDGRID_API_KEY:}
  ai:
    image:
      scene-model: ${INVITELY_SCENE_IMAGE_MODEL:imagen-3.0-generate-001}
      gemini-flash-image-model: ${INVITELY_GEMINI_FLASH_IMAGE_MODEL:gemini-2.5-flash-image}

server:
  port: 8080

logging:
  level:
    com.invitely: DEBUG
    org.springframework.ai: INFO
